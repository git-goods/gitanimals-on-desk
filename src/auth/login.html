<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitAnimals — 로그인</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f9f9f9;
      color: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      user-select: none;
      -webkit-app-region: drag;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      -webkit-app-region: no-drag;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .sub {
      font-size: 13px;
      color: #666;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #24292e;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      justify-content: center;
      transition: background 0.15s;
    }
    .btn:hover { background: #3a3f45; }
    .btn:active { background: #1a1d21; }
    .btn:disabled { background: #999; cursor: not-allowed; }
    .error {
      display: none;
      margin-top: 16px;
      padding: 10px 14px;
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      font-size: 12px;
      color: #856404;
      line-height: 1.5;
      text-align: left;
    }
    .error.visible { display: block; }
    .waiting {
      display: none;
      margin-top: 16px;
      font-size: 12px;
      color: #888;
    }
    .waiting.visible { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🦊</div>
    <h1>GitAnimals on Desk</h1>
    <p class="sub">GitAnimals 계정으로 로그인하면<br>내 페르소나를 데스크톱에서 만날 수 있어요.</p>
    <button class="btn" id="loginBtn" onclick="login()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.39.6.11.82-.26.82-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.54-1.38-1.33-1.75-1.33-1.75-1.09-.74.08-.73.08-.73 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02.004 2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
      </svg>
      GitAnimals로 로그인
    </button>
    <p class="waiting" id="waiting">브라우저에서 로그인을 완료해 주세요…</p>
    <div class="error" id="error"></div>
  </div>
  <script>
    const ERROR_MESSAGES = {
      state_mismatch: "보안 검증 실패. 다시 시도해 주세요.",
      port_conflict: "포트 충돌로 로그인 서버를 시작할 수 없습니다. 잠시 후 다시 시도해 주세요.",
      token_store_failed: "토큰 저장에 실패했습니다. 다시 시도해 주세요.",
      token_rejected: "서버가 토큰을 거부했습니다. 다시 시도해 주세요. 반복되면 gitanimals.org에서 로그아웃 후 재시도해 주세요.",
      server_error: "서버 오류가 발생했습니다. 다시 시도해 주세요.",
      auth_timeout: "로그인 시간이 초과되었습니다. 다시 시도해 주세요.",
      network: "네트워크에 연결할 수 없습니다. 인터넷 연결을 확인해 주세요.",
    };

    function login() {
      document.getElementById("loginBtn").disabled = true;
      document.getElementById("waiting").classList.add("visible");
      document.getElementById("error").classList.remove("visible");
      window.gitAnimals.openBrowser();
    }

    function showError(code) {
      const el = document.getElementById("error");
      el.textContent = ERROR_MESSAGES[code] || "알 수 없는 오류. 다시 시도해 주세요.";
      el.classList.add("visible");
      document.getElementById("waiting").classList.remove("visible");
      document.getElementById("loginBtn").disabled = false;
    }

    window.gitAnimals.onError(showError);
  </script>
</body>
</html>
