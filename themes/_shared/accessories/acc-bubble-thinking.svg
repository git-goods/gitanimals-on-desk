<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Shared thinking bubble accessory — pixel-art speech bubble with 3 animated dots
    Staggered opacity cycle (2s), blue dots (#0082FC)
    Position via theme.json anchor transform
  -->
  <g>
    <style>
      @keyframes acc-think-dot-1 {
        0%, 20%  { opacity: 0.2; }
        30%, 60% { opacity: 1; }
        70%, 100%{ opacity: 0.2; }
      }
      @keyframes acc-think-dot-2 {
        0%, 30%  { opacity: 0.2; }
        40%, 70% { opacity: 1; }
        80%, 100%{ opacity: 0.2; }
      }
      @keyframes acc-think-dot-3 {
        0%, 40%  { opacity: 0.2; }
        50%, 80% { opacity: 1; }
        90%, 100%{ opacity: 0.2; }
      }
      .acc-think-d1 { animation: acc-think-dot-1 2s ease-in-out infinite; }
      .acc-think-d2 { animation: acc-think-dot-2 2s ease-in-out infinite; }
      .acc-think-d3 { animation: acc-think-dot-3 2s ease-in-out infinite; }
    </style>
    <!-- Bubble body -->
    <g fill="white" fill-opacity="0.92">
      <rect x="1" y="0" width="7" height="6"/>
      <rect x="0" y="1" width="9" height="4"/>
    </g>
    <!-- Tail (down-left) -->
    <rect x="0" y="5" width="2" height="1" fill="white" fill-opacity="0.92"/>
    <rect x="-1" y="6" width="1" height="1" fill="white" fill-opacity="0.92"/>
    <!-- Dots -->
    <rect class="acc-think-d1" x="1" y="2.25" width="1.5" height="1.5" fill="#0082FC"/>
    <rect class="acc-think-d2" x="3.75" y="2.25" width="1.5" height="1.5" fill="#0082FC"/>
    <rect class="acc-think-d3" x="6.5" y="2.25" width="1.5" height="1.5" fill="#0082FC"/>
  </g>
</svg>
