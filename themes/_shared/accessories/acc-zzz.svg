<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Shared Zzz accessory — pixel-art Z particles floating up-right
    3 staggered z's, 6s cycle, fox-style trajectory with scale
    Position via theme.json anchor transform
  -->
  <g>
    <style>
      @keyframes acc-zzz-float {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        10%  { opacity: 1; }
        50%  { transform: translate(4px, -6px) scale(0.8); opacity: 1; }
        90%  { opacity: 0.7; }
        100% { transform: translate(8px, -12px) scale(1.1); opacity: 0; }
      }
      .acc-zzz   { opacity: 0; animation: acc-zzz-float 6s ease-in-out infinite; }
      .acc-zzz-1 { animation-delay: 0s; }
      .acc-zzz-2 { animation-delay: 2s; }
      .acc-zzz-3 { animation-delay: 4s; }
    </style>
    <defs>
      <g id="acc-zzz-pixel-z">
        <rect x="0" y="0" width="4" height="1"/>
        <rect x="2" y="1" width="1" height="1"/>
        <rect x="1" y="2" width="1" height="1"/>
        <rect x="0" y="3" width="4" height="1"/>
      </g>
    </defs>
    <g class="acc-zzz acc-zzz-1"><use href="#acc-zzz-pixel-z" fill="#90A4AE"/></g>
    <g class="acc-zzz acc-zzz-2"><use href="#acc-zzz-pixel-z" fill="#B0BEC5"/></g>
    <g class="acc-zzz acc-zzz-3"><use href="#acc-zzz-pixel-z" fill="#CFD8DC"/></g>
  </g>
</svg>
